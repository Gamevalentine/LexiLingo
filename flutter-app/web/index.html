<body>
  <script>
    // Clear only the old Flutter cache once. Repeating this on every visit
    // defeats browser caching and slows subsequent loads.
    (async () => {
      const cleanupKey = 'lexilingo-cache-cleanup-v2';
      try {
        if (localStorage.getItem(cleanupKey) === '1') return;
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        localStorage.setItem(cleanupKey, '1');
      } catch (_) {
        // Cache cleanup must never block app startup.
      }
    })();
  </script>

</body>
