name: Diagnose live LexiLingo API path

on:
  push:
    branches:
      - phase-1-english-assistant
    paths:
      - .github/workflows/diagnose-live-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe live frontend, proxy and upstream
        shell: bash
        run: |
          set +e

          probe_get() {
            label="$1"
            url="$2"
            echo "===== $label ====="
            curl -sS --max-time 20 \
              -D /tmp/headers.txt \
              -o /tmp/body.txt \
              -w 'HTTP=%{http_code} TIME=%{time_total}s\n' \
              "$url"
            echo "--- headers ---"
            sed -n '1,30p' /tmp/headers.txt
            echo "--- body ---"
            head -c 1200 /tmp/body.txt
            echo
            echo
          }

          probe_options() {
            label="$1"
            url="$2"
            echo "===== $label ====="
            curl -sS --max-time 20 -X OPTIONS \
              -H 'Origin: https://lexilingo-assistant.pages.dev' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' \
              -D /tmp/headers.txt \
              -o /tmp/body.txt \
              -w 'HTTP=%{http_code} TIME=%{time_total}s\n' \
              "$url"
            echo "--- headers ---"
            sed -n '1,40p' /tmp/headers.txt
            echo "--- body ---"
            head -c 1200 /tmp/body.txt
            echo
            echo
          }

          probe_post_invalid() {
            label="$1"
            url="$2"
            echo "===== $label ====="
            curl -sS --max-time 25 -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' \
              -D /tmp/headers.txt \
              -o /tmp/body.txt \
              -w 'HTTP=%{http_code} TIME=%{time_total}s\n' \
              "$url"
            echo "--- headers ---"
            sed -n '1,40p' /tmp/headers.txt
            echo "--- body ---"
            head -c 2000 /tmp/body.txt
            echo
            echo
          }

          probe_get "Pages root" "https://lexilingo-assistant.pages.dev/"
          probe_get "Pages deployed prod_config" "https://lexilingo-assistant.pages.dev/assets/assets/env/prod_config"
          probe_get "Pages proxy health" "https://lexilingo-assistant.pages.dev/api/v1/health"
          probe_get "Upstream health" "https://api.lexilingo.me/api/v1/health"
          probe_options "Pages proxy register preflight" "https://lexilingo-assistant.pages.dev/api/v1/auth/register"
          probe_options "Upstream register preflight from Pages origin" "https://api.lexilingo.me/api/v1/auth/register"
          probe_post_invalid "Pages proxy register malformed request" "https://lexilingo-assistant.pages.dev/api/v1/auth/register"
          probe_post_invalid "Upstream register malformed request" "https://api.lexilingo.me/api/v1/auth/register"
          echo "===== Chrome-like upstream health ====="
          curl -sS --max-time 20 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' \
            -H 'Accept: application/json,text/plain,*/*' \
            -D /tmp/headers.txt -o /tmp/body.txt \
            -w 'HTTP=%{http_code} TIME=%{time_total}s\n' \
            "https://api.lexilingo.me/api/v1/health"
          sed -n '1,30p' /tmp/headers.txt
          head -c 1200 /tmp/body.txt
          echo
          echo

          echo "===== Chrome-like Pages proxy malformed register ====="
          curl -sS --max-time 25 -X POST \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' \
            -H 'Accept: application/json,text/plain,*/*' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://lexilingo-assistant.pages.dev' \
            --data '{}' \
            -D /tmp/headers.txt -o /tmp/body.txt \
            -w 'HTTP=%{http_code} TIME=%{time_total}s\n' \
            "https://lexilingo-assistant.pages.dev/api/v1/auth/register"
          sed -n '1,40p' /tmp/headers.txt
          head -c 2000 /tmp/body.txt
          echo
          echo


          echo "===== Deployed bootstrap/service worker diagnostics ====="
          curl -sS --max-time 20 "https://lexilingo-assistant.pages.dev/flutter_bootstrap.js" -o /tmp/bootstrap.js
          echo "-- flutter_bootstrap.js service worker refs --"
          grep -n -E 'serviceWorker|flutter_service_worker|main.dart.js' /tmp/bootstrap.js | head -40 || true

          curl -sS --max-time 20 "https://lexilingo-assistant.pages.dev/flutter_service_worker.js" -o /tmp/sw.js
          echo "-- flutter_service_worker.js first lines --"
          head -40 /tmp/sw.js || true

          curl -sS --max-time 30 "https://lexilingo-assistant.pages.dev/main.dart.js" -o /tmp/main.dart.js
          echo "-- URL strings in deployed main.dart.js --"
          printf "pages.dev occurrences: "
          grep -o 'lexilingo-assistant\.pages\.dev' /tmp/main.dart.js | wc -l || true
          printf "api.lexilingo.me occurrences: "
          grep -o 'api\.lexilingo\.me' /tmp/main.dart.js | wc -l || true
          echo "-- nearby URL snippets --"
          grep -o -E '.{0,120}(lexilingo-assistant\.pages\.dev|api\.lexilingo\.me).{0,180}' /tmp/main.dart.js | head -20 || true
