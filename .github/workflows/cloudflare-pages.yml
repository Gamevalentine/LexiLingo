name: Deploy LexiLingo English Assistant to Cloudflare Pages

on:
  push:
    branches:
      - phase-1-english-assistant
    paths:
      - flutter-app/**
      - functions/**
      - wrangler.toml
      - .github/workflows/cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-phase-1-english-assistant
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Enable Flutter web
        working-directory: flutter-app
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Stamp build revision
        run: |
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > flutter-app/web/build-info.json

      - name: Build Flutter web
        working-directory: flutter-app
        run: flutter build web --release

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create lexilingo-assistant --production-branch phase-1-english-assistant || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy flutter-app/build/web \
            --project-name=lexilingo-assistant \
            --branch=phase-1-english-assistant \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="English assistant preview"
