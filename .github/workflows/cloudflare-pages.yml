name: Deploy LexiLingo English Assistant to Cloudflare Pages

on:
  push:
    branches:
      - phase-1-english-assistant
    paths:
      - flutter-app/**
      - admin-service/**
      - functions/**
      - migrations/**
      - wrangler.toml
      - .github/workflows/cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-phase-1-english-assistant
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Enable Flutter web
        working-directory: flutter-app
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Stamp build revision
        run: |
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > flutter-app/web/build-info.json

      - name: Build Flutter web
        working-directory: flutter-app
        run: flutter build web --release

      - name: Configure Admin build
        run: |
          GOOGLE_CLIENT_ID="$(grep '^GOOGLE_SERVER_CLIENT_ID=' flutter-app/assets/env/prod_config | cut -d= -f2-)"
          test -n "$GOOGLE_CLIENT_ID"
          echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> "$GITHUB_ENV"

      - name: Build Admin console
        working-directory: admin-service
        env:
          VITE_ENV: production
          VITE_BACKEND_URL: https://lexilingo-assistant.pages.dev/api/v1
          VITE_AI_URL: https://lexilingo-assistant.pages.dev/api/v1
          VITE_USE_GATEWAY: "false"
          VITE_GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build:check
          rm -rf ../flutter-app/build/web/admin
          mkdir -p ../flutter-app/build/web/admin
          cp -R dist/. ../flutter-app/build/web/admin/

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create lexilingo-assistant --production-branch phase-1-english-assistant || true

      - name: Ensure D1 content database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler@4 d1 list --json | jq -r '.[] | select(.name=="lexilingo-content") | (.uuid // .id // empty)' | head -n1)"
          if [ -z "$DB_ID" ]; then
            npx wrangler@4 d1 create lexilingo-content --location apac
            DB_ID="$(npx wrangler@4 d1 list --json | jq -r '.[] | select(.name=="lexilingo-content") | (.uuid // .id // empty)' | head -n1)"
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 d1 execute lexilingo-content --remote --file=migrations/0001_admin_content.sql --yes

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy flutter-app/build/web \
            --project-name=lexilingo-assistant \
            --branch=phase-1-english-assistant \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="English assistant + admin" \
            --d1 CONTENT_DB="$D1_DATABASE_ID" \
            --binding GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --binding SUPER_ADMIN_EMAILS="anhtsizoo00@gmail.com"
