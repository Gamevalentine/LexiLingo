name: QA LexiLingo Web

on:
  push:
    branches:
      - phase-1-english-assistant
    paths:
      - flutter-app/**
      - admin-service/**
      - functions/**
      - migrations/**
      - wrangler.toml
      - .github/workflows/web-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-lexilingo-web
  cancel-in-progress: true

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Release compile smoke
        run: flutter build web --release --no-wasm-dry-run

  admin-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: admin-service
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and Vite build
        env:
          VITE_ENV: production
          VITE_BACKEND_URL: https://lexilingo-assistant.pages.dev/api/v1
          VITE_AI_URL: https://lexilingo-assistant.pages.dev/api/v1
          VITE_GOOGLE_CLIENT_ID: 693219123709-s50js39652e6l4ps5l82441jhuncdemr.apps.googleusercontent.com
        run: npm run build:check

  live-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact Pages deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            live_sha=$(curl -fsS --max-time 10 "https://lexilingo-assistant.pages.dev/build-info.json?ts=$i" 2>/dev/null | jq -r '.sha // empty' || true)
            echo "live=$live_sha expected=$GITHUB_SHA"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for deployment $GITHUB_SHA"
          exit 1

      - name: Verify public shell
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 https://lexilingo-assistant.pages.dev/)
          test "$code" = "200"
          grep -q "flutter_bootstrap.js" /tmp/home.html

      - name: Verify public config
        run: |
          set -euo pipefail
          cfg=$(curl -fsS --max-time 20 https://lexilingo-assistant.pages.dev/assets/assets/env/prod_config)
          echo "$cfg"
          echo "$cfg" | grep -q 'API_BASE_URL=https://lexilingo-assistant.pages.dev/api/v1'

      - name: Verify guest session API
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 -X POST https://lexilingo-assistant.pages.dev/api/v1/lexi/sessions -H 'Content-Type: application/json' --data '{"user_id":"qa_guest"}')
          echo "$body"
          echo "$body" | jq -e '.session_id | length > 0' >/dev/null

      - name: Verify Workers AI answer
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 60 -X POST https://lexilingo-assistant.pages.dev/api/v1/lexi/chat -H 'Content-Type: application/json' --data '{"user_id":"qa_guest","session_id":"qa","message":"Reply with one short English sentence for a B1 learner.","learner_level":"B1","native_language":"vi"}')
          echo "$body"
          echo "$body" | jq -e '(.lexi_response // .response // "") | length > 0' >/dev/null

      - name: Verify D1 course API
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 "https://lexilingo-assistant.pages.dev/api/v1/courses?page=1&page_size=10")
          echo "$body"
          echo "$body" | jq -e '.data | type == "array"' >/dev/null
          echo "$body" | jq -e '.pagination.page == 1' >/dev/null

      - name: Verify Admin shell
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/admin.html -w '%{http_code}' --max-time 20 https://lexilingo-assistant.pages.dev/admin/)
          test "$code" = "200"
          grep -q 'id="root"' /tmp/admin.html
          grep -q 'accounts.google.com/gsi/client' /tmp/admin.html

      - name: Verify Admin API is protected
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/admin-api.json -w '%{http_code}' --max-time 20 https://lexilingo-assistant.pages.dev/api/v1/admin/courses)
          test "$code" = "401"

      - name: Verify legacy API fails fast, never 522
        run: |
          set -euo pipefail
          metrics=$(curl -sS --max-time 8 -o /tmp/legacy.json -w '%{http_code} %{time_total}' https://lexilingo-assistant.pages.dev/api/v1/legacy-disabled-smoke)
          echo "$metrics"
          code=$(echo "$metrics" | awk '{print $1}')
          elapsed=$(echo "$metrics" | awk '{print $2}')
          test "$code" = "410"
          awk -v t="$elapsed" 'BEGIN { exit !(t < 5.0) }'

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for exact Pages deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            live_sha=$(curl -fsS --max-time 10 "https://lexilingo-assistant.pages.dev/build-info.json?ts=$i" 2>/dev/null | jq -r '.sha // empty' || true)
            echo "live=$live_sha expected=$GITHUB_SHA"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for deployment $GITHUB_SHA"
          exit 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium

      - name: Browser route smoke
        run: |
          cat > qa.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              ['home-desktop', 'https://lexilingo-assistant.pages.dev/', 1440, 900],
              ['home-mobile', 'https://lexilingo-assistant.pages.dev/', 390, 844],
              ['courses', 'https://lexilingo-assistant.pages.dev/#/courses', 1440, 900],
              ['lexi', 'https://lexilingo-assistant.pages.dev/#/lexi', 1440, 900],
              ['voice-practice', 'https://lexilingo-assistant.pages.dev/#/voice-practice', 1440, 900],
              ['games', 'https://lexilingo-assistant.pages.dev/#/games', 1440, 900],
              ['today-plan', 'https://lexilingo-assistant.pages.dev/#/today-plan', 1440, 900],
              ['placement-test', 'https://lexilingo-assistant.pages.dev/#/placement-test', 1440, 900],
              ['news', 'https://lexilingo-assistant.pages.dev/#/news', 1440, 900],
              ['podcast', 'https://lexilingo-assistant.pages.dev/#/podcast', 1440, 900],
              ['books', 'https://lexilingo-assistant.pages.dev/#/books', 1440, 900],
            ];

            let failed = false;
            for (const [name, url, width, height] of targets) {
              const page = await browser.newPage({
                viewport: { width, height },
                locale: 'vi-VN',
              });
              const problems = [];

              page.on('pageerror', error => {
                problems.push('pageerror: ' + (error.stack || error.message));
              });
              page.on('response', response => {
                const responseUrl = response.url();
                const status = response.status();
                if (responseUrl.includes('/api/v1/') && status >= 500) {
                  problems.push('API ' + status + ': ' + responseUrl);
                }
              });

              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForSelector('flutter-view', { timeout: 20000 });
                await page.waitForTimeout(3500);
              } catch (error) {
                problems.push('navigation: ' + error.message);
              }

              console.log(name + ': ' + (problems.length ? 'FAIL' : 'PASS'));
              for (const problem of problems) console.log('  ' + problem);
              if (problems.length) failed = true;
              await page.close();
            }

            await browser.close();
            if (failed) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node qa.js
