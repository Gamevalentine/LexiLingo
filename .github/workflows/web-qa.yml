name: QA LexiLingo Web

on:
  push:
    branches:
      - phase-1-english-assistant
    paths:
      - flutter-app/**
      - functions/**
      - wrangler.toml
      - .github/workflows/web-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-lexilingo-web
  cancel-in-progress: true

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Release compile smoke
        run: flutter build web --release --no-wasm-dry-run

  live-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for matching Pages deployment
        run: sleep 5

      - name: Verify public shell
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 https://lexilingo-assistant.pages.dev/)
          test "$code" = "200"
          grep -q "flutter_bootstrap.js" /tmp/home.html

      - name: Verify public config
        run: |
          set -euo pipefail
          cfg=$(curl -fsS --max-time 20 https://lexilingo-assistant.pages.dev/assets/assets/env/prod_config)
          echo "$cfg"
          echo "$cfg" | grep -q 'API_BASE_URL=https://lexilingo-assistant.pages.dev/api/v1'

      - name: Verify guest session API
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 -X POST https://lexilingo-assistant.pages.dev/api/v1/lexi/sessions -H 'Content-Type: application/json' --data '{"user_id":"qa_guest"}')
          echo "$body"
          echo "$body" | jq -e '.session_id | length > 0' >/dev/null

      - name: Verify Workers AI answer
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 60 -X POST https://lexilingo-assistant.pages.dev/api/v1/lexi/chat -H 'Content-Type: application/json' --data '{"user_id":"qa_guest","session_id":"qa","message":"Reply with one short English sentence for a B1 learner.","learner_level":"B1","native_language":"vi"}')
          echo "$body"
          echo "$body" | jq -e '(.lexi_response // .response // "") | length > 0' >/dev/null

      - name: Verify legacy API fails fast, never 522
        run: |
          set -euo pipefail
          metrics=$(curl -sS --max-time 8 -o /tmp/legacy.json -w '%{http_code} %{time_total}' https://lexilingo-assistant.pages.dev/api/v1/courses)
          echo "$metrics"
          code=$(echo "$metrics" | awk '{print $1}')
          elapsed=$(echo "$metrics" | awk '{print $2}')
          test "$code" = "410"
          awk -v t="$elapsed" 'BEGIN { exit !(t < 5.0) }'

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for matching Pages deployment
        run: sleep 5

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium

      - name: Browser route smoke
        run: |
          cat > qa.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              ['home-desktop', 'https://lexilingo-assistant.pages.dev/', 1440, 900],
              ['home-mobile', 'https://lexilingo-assistant.pages.dev/', 390, 844],
              ['courses', 'https://lexilingo-assistant.pages.dev/#/courses', 1440, 900],
              ['lexi', 'https://lexilingo-assistant.pages.dev/#/lexi', 1440, 900],
              ['games', 'https://lexilingo-assistant.pages.dev/#/games', 1440, 900],
            ];

            let failed = false;
            for (const [name, url, width, height] of targets) {
              const page = await browser.newPage({ viewport: { width, height } });
              const problems = [];

              page.on('pageerror', error => {
                problems.push('pageerror: ' + (error.stack || error.message));
              });
              page.on('response', response => {
                const responseUrl = response.url();
                const status = response.status();
                if (responseUrl.includes('/api/v1/') && status >= 500) {
                  problems.push('API ' + status + ': ' + responseUrl);
                }
              });

              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForSelector('flutter-view', { timeout: 10000 });
                await page.waitForTimeout(5000);
              } catch (error) {
                problems.push('navigation: ' + error.message);
              }

              console.log(name + ': ' + (problems.length ? 'FAIL' : 'PASS'));
              for (const problem of problems) console.log('  ' + problem);
              if (problems.length) failed = true;
              await page.close();
            }

            await browser.close();
            if (failed) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node qa.js
