name: Baseline Flutter Web Preview

on:
  push:
    branches:
      - baseline-original
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build original Flutter web
        run: flutter build web --release --base-href "/Gamevalentine/LexiLingo/preview-web/"

      - name: Publish compiled web bundle to preview-web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview-web
          publish_dir: ./flutter-app/build/web
          force_orphan: true
